name: Monthly link rot check

# Sources move and videos get deleted, and neither shows up in a build — the site
# keeps rendering a link that now 404s. This re-checks both sets once a month and
# files the result as an issue, because a red run nobody is watching for is the
# same as no check at all.
on:
  schedule:
    - cron: '17 6 1 * *'   # 06:17 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # continue-on-error on both: a dead video should not stop the link check
      # from running, and the report below wants whatever each of them found.
      #
      # set -o pipefail is load-bearing. The default shell for `run` is `bash -e`
      # with pipefail OFF, so `node ... | tee` would report tee's exit status and
      # every month would look clean no matter what the checker found.
      - name: Check further-reading links
        id: links
        continue-on-error: true
        run: |
          set -o pipefail
          node build/links.js 2>&1 | tee links.txt

      - name: Check videos
        id: videos
        continue-on-error: true
        run: |
          set -o pipefail
          node build/yt.js audit 2>&1 | tee videos.txt

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          LINKS_OUTCOME: ${{ steps.links.outcome }}
          VIDEOS_OUTCOME: ${{ steps.videos.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Both scripts exit non-zero only on genuine rot: a 404, a host that no
          # longer resolves, a deleted video. Refusals and challenge pages are
          # reported inside the output but do not fail, so this stays quiet.
          if [ "$LINKS_OUTCOME" = "success" ] && [ "$VIDEOS_OUTCOME" = "success" ]; then
            echo "No rot found. Summary:"
            tail -1 links.txt
            tail -1 videos.txt
            exit 0
          fi

          {
            echo "The monthly check found links or videos that no longer resolve."
            echo
            echo "[Full run]($RUN_URL)"
            echo
            echo '## Further reading'
            echo '```'
            tail -c 20000 links.txt
            echo '```'
            echo
            echo '## Videos'
            echo '```'
            tail -c 20000 videos.txt
            echo '```'
          } > body.md

          TITLE="Link rot check: $(date -u +'%B %Y')"
          # One issue per month, reopened and updated rather than a new one each
          # run, so a manual re-run after a fix does not pile up duplicates.
          NUM=$(gh issue list --state all --search "$TITLE in:title" --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file body.md
            gh issue reopen "$NUM" || true
            echo "updated issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file body.md --label "link-rot" \
              || gh issue create --title "$TITLE" --body-file body.md
          fi
          exit 1
