name: Monthly link rot check

# Sources move and videos get deleted, and neither shows up in a build — the site
# keeps rendering a link that now 404s. This re-checks both sets once a month and
# files the result as an issue, because a red run nobody is watching for is the
# same as no check at all.
on:
  schedule:
    - cron: '17 6 1 * *'   # 06:17 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: write   # the keep-alive commit at the end; see that step
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # match pages.yml; see the note there

      # continue-on-error on both: a dead video should not stop the link check
      # from running, and the report below wants whatever each of them found.
      #
      # set -o pipefail is load-bearing. The default shell for `run` is `bash -e`
      # with pipefail OFF, so `node ... | tee` would report tee's exit status and
      # every month would look clean no matter what the checker found.
      - name: Check further-reading links
        id: links
        continue-on-error: true
        run: |
          set -o pipefail
          node build/links.js 2>&1 | tee links.txt

      - name: Check videos
        id: videos
        continue-on-error: true
        run: |
          set -o pipefail
          node build/yt.js audit 2>&1 | tee videos.txt

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          LINKS_OUTCOME: ${{ steps.links.outcome }}
          VIDEOS_OUTCOME: ${{ steps.videos.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Both scripts exit non-zero only on genuine rot: a 404, a host that no
          # longer resolves, a deleted video. Refusals and challenge pages are
          # reported inside the output but do not fail, so this stays quiet.
          if [ "$LINKS_OUTCOME" = "success" ] && [ "$VIDEOS_OUTCOME" = "success" ]; then
            echo "No rot found. Summary:"
            tail -1 links.txt
            tail -1 videos.txt
            exit 0
          fi

          # Report the part that needs action. links.js prints DEAD, then
          # SUSPECT, then BLOCKED, then its summary, and BLOCKED is by far the
          # longest section while being the one nobody has to do anything about
          # — it is hosts that refuse automated clients and work in a browser.
          # `tail -c 20000` therefore kept the noise and truncated the DEAD list
          # off the top, which is how the September, October and November issues
          # came to open mid-sentence with their findings missing.
          dead() { awk '/^DEAD \(/{f=1} /^(SUSPECT|BLOCKED) \(/{f=0} f' "$1"; }
          summary() { grep -E '^[0-9]+ OK,' "$1" | tail -1; }
          {
            echo "The monthly check found links or videos that no longer resolve."
            echo
            echo "[Full run]($RUN_URL) — the full output, including the SUSPECT and"
            echo "BLOCKED sections left out below, is in the run log."
            echo
            echo '## Further reading'
            echo '```'
            summary links.txt
            echo
            dead links.txt
            echo '```'
            echo
            echo '## Videos'
            echo '```'
            summary videos.txt
            echo
            grep -E '^(GONE|RETITLED)' videos.txt || echo '(none)'
            echo '```'
          } | head -c 60000 > body.md

          TITLE="Link rot check: $(date -u +'%B %Y')"
          # One issue per month, reopened and updated rather than a new one each
          # run, so a manual re-run after a fix does not pile up duplicates.
          NUM=$(gh issue list --state all --search "$TITLE in:title" --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file body.md
            gh issue reopen "$NUM" || true
            echo "updated issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file body.md --label "link-rot" \
              || gh issue create --title "$TITLE" --body-file body.md
          fi
          exit 1

      # GitHub disables a scheduled workflow after 60 days without a COMMIT to
      # the repository. Workflow runs do not count: this one ran on 1 September,
      # 1 October and 1 November and was switched off anyway, because the last
      # commit was 19 August. A check that only matters when nobody is touching
      # the repo cannot depend on someone touching the repo, so the run makes its
      # own commit and resets the clock every month.
      #
      # if: always() because the step above exits 1 whenever it finds rot, which
      # is exactly when the schedule most needs to survive.
      #
      # This does not trigger the Pages deploy: a push authenticated with
      # GITHUB_TOKEN does not start another workflow run.
      - name: Keep the schedule alive
        if: always()
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-linkcheck
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-linkcheck
          # --quiet exit 0 when nothing changed, so a re-run in the same second
          # does not fail the job on an empty commit.
          git diff --cached --quiet && exit 0
          git commit -m "Link rot check ran $(date -u +'%Y-%m-%d')"
          git push
