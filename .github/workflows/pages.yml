name: Build and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Every action here is pinned to a major that declares node24. GitHub is
      # removing the node20 runtime from the runners, and the older majors were
      # being forced onto node24 with a deprecation warning on every run.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 is the LTS line, supported until 2028-04-30; revisit then.
          # Pinned as a number rather than lts/* so a new LTS cannot silently
          # change what the deploy builds on. style.yml and linkcheck.yml pin
          # the same version on purpose — a check running on a different
          # runtime than the deploy can miss the bug that matters.
          node-version: 24
      - name: Build dashboard from markdown
        run: node build/build.js
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
